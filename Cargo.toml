[workspace]
resolver = "3"
members = ["crates/pir-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Silicon-Docket/pir-research"

# Lints as configuration rather than CI flags, so `cargo clippy` locally and in
# CI enforce the same thing. This is a measurement harness: a panic mid-sweep
# costs a run rather than a request, but a benchmark that is quietly wrong is
# worse than one that crashes.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "allow"

# The benchmark must be measuring the workload, not the optimiser's absence.
# Debug builds are meaningless here and the harness refuses to run in one.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
